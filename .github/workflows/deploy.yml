name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          LOCAL_MODE: "true"
          GEMINI_API_KEY: ""
        run: pytest tests/ -v

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Skip deploy (awaiting GCP setup)
        run: |
          echo "Deploy step is a placeholder — Cloud Run deploy happens"
          echo "via cloudbuild.yaml once GCP project is provisioned."
          echo "Skipping for now to avoid failing builds."
